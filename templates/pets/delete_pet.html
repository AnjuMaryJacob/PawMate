{% extends 'base.html' %}

{% block content %}
<section class="add-pet-page">
    <div class="add-pet-container">

        <div class="add-pet-card delete-pet-card">
            <div class="delete-pet-icon">⚠️</div>

            <h1>Delete {{ pet.name }}?</h1>

            <p>
                Are you sure you want to delete this pet listing?
                This action cannot be undone.
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="delete-pet-button">
                    Yes, Delete Listing
                </button>

                <a href="{% url 'pet_detail' pet.pk %}"
                   class="add-pet-cancel">
                    No, Keep Listing
                </a>
            </form>
        </div>

    </div>
</section>
{% endblock %}
